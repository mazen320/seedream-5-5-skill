<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="Workflow: ask, prompt, pre-flight check, render, review and fix">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1330"/><stop offset="1" stop-color="#2A1540"/>
    </linearGradient>
    <clipPath id="wc"><rect width="1280" height="210" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#wc)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1280" height="210" fill="url(#wbg)"/>
    <g stroke="#FFC37A" stroke-opacity="0.45" stroke-width="2" fill="none">
      <path d="M200 82 H316"/><path d="M308 75 L316 82 L308 89"/>
      <path d="M440 82 H556"/><path d="M548 75 L556 82 L548 89"/>
      <path d="M680 82 H796"/><path d="M788 75 L796 82 L788 89"/>
      <path d="M920 82 H1036"/><path d="M1028 75 L1036 82 L1028 89"/>
    </g>
    <g text-anchor="middle">
      <circle cx="144" cy="82" r="40" fill="#FFB547" fill-opacity="0.16" stroke="#FFB547" stroke-opacity="0.55"/>
      <text x="144" y="91" fill="#FFC970" font-size="24" font-weight="800">1</text>
      <text x="144" y="156" fill="#FFFFFF" font-size="22" font-weight="700">Ask</text>
      <text x="144" y="186" fill="#9C98C4" font-size="17">goal, ratio, references</text>

      <circle cx="384" cy="82" r="40" fill="#FF7A6B" fill-opacity="0.16" stroke="#FF7A6B" stroke-opacity="0.55"/>
      <text x="384" y="91" fill="#FF9C90" font-size="24" font-weight="800">2</text>
      <text x="384" y="156" fill="#FFFFFF" font-size="22" font-weight="700">Prompt</text>
      <text x="384" y="186" fill="#9C98C4" font-size="17">prose + image roles</text>

      <circle cx="624" cy="82" r="40" fill="#D46CF0" fill-opacity="0.16" stroke="#D46CF0" stroke-opacity="0.55"/>
      <text x="624" y="91" fill="#E39AFA" font-size="24" font-weight="800">3</text>
      <text x="624" y="156" fill="#FFFFFF" font-size="22" font-weight="700">Pre-flight</text>
      <text x="624" y="186" fill="#9C98C4" font-size="17">known failure modes</text>

      <circle cx="864" cy="82" r="40" fill="#7896FF" fill-opacity="0.16" stroke="#7896FF" stroke-opacity="0.55"/>
      <text x="864" y="91" fill="#A0B6FF" font-size="24" font-weight="800">4</text>
      <text x="864" y="156" fill="#FFFFFF" font-size="22" font-weight="700">Render</text>
      <text x="864" y="186" fill="#9C98C4" font-size="17">image + .txt record</text>

      <circle cx="1104" cy="82" r="40" fill="#4FB8E8" fill-opacity="0.16" stroke="#4FB8E8" stroke-opacity="0.55"/>
      <text x="1104" y="91" fill="#86D2F2" font-size="24" font-weight="800">5</text>
      <text x="1104" y="156" fill="#FFFFFF" font-size="22" font-weight="700">Review &amp; fix</text>
      <text x="1104" y="186" fill="#9C98C4" font-size="17">one change per round</text>
    </g>
  </g>
</svg>
